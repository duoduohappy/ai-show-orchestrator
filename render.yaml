services:
- type: web
  name: ai-show-orchestrator
  runtime: node
  plan: free
  buildCommand: npm ci --omit=dev --ignore-scripts
  startCommand: npm start
  healthCheckPath: /api/health
  envVars:
  - key: NODE_VERSION
    value: 24.21.0
  - key: HOST
    value: 0.0.0.0
  - key: DATA_DIR
    value: /tmp/ai-show-orchestrator
  - key: OBS_TRANSPORT
    value: gateway
  - key: OBS_MODE
    value: real
  - key: SHOW_OPERATOR_PASSWORD
    generateValue: true
  - key: GATEWAY_TOKEN
    generateValue: true
  - key: SHOW_TEST_FAULTS
    value: 'false'
  - key: AI_PROVIDER
    value: compatible
  - key: AI_BASE_URL
    value: ''
  - key: AI_MODEL
    value: ''
  - key: AI_API_KEY
    value: ''
  - key: DEMO_MODE
    value: ephemeral
